name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:strict
      - run: npm run test:node
      - run: npm run test:package-install

  quality-and-demos:
    name: Quality, package and demos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/taro-demo/package-lock.json
            demo/uni-app-demo/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: skills/image-processing/requirements.txt
      - run: npm ci
      - run: npm run lint
      - run: npm run test:image-processing
      - run: npm ci --prefix demo/taro-demo
      - run: npm --prefix demo/taro-demo run build:weapp
      - run: npm ci --prefix demo/uni-app-demo
      - run: npm --prefix demo/uni-app-demo run build:mp-weixin
      - run: npm --prefix demo/uni-app-demo run type-check
